<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nutshell logo">
  <defs>
    <linearGradient id="shell" x1="20" y1="8" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C68A4E"/>
      <stop offset="1" stop-color="#8A5A2B"/>
    </linearGradient>
  </defs>

  <!-- Outer walnut shell: two rounded halves meeting at a seam -->
  <path d="M64 10
           C 34 10, 16 34, 16 64
           C 16 96, 40 118, 64 118
           C 88 118, 112 96, 112 64
           C 112 34, 94 10, 64 10 Z"
        fill="none" stroke="url(#shell)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Central seam -->
  <path d="M64 12 L64 116" stroke="url(#shell)" stroke-width="5" stroke-linecap="round"/>

  <!-- Left inner folds forming a brain/synapse curve -->
  <path d="M56 26
           C 34 34, 30 50, 44 58
           C 30 64, 34 82, 52 86
           C 40 94, 46 108, 60 106"
        fill="none" stroke="url(#shell)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right inner folds (mirrored) -->
  <path d="M72 26
           C 94 34, 98 50, 84 58
           C 98 64, 94 82, 76 86
           C 88 94, 82 108, 68 106"
        fill="none" stroke="url(#shell)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Synapse nodes -->
  <circle cx="44" cy="58" r="4" fill="#8A5A2B"/>
  <circle cx="84" cy="58" r="4" fill="#8A5A2B"/>
  <circle cx="52" cy="86" r="3.5" fill="#8A5A2B"/>
  <circle cx="76" cy="86" r="3.5" fill="#8A5A2B"/>
</svg>
